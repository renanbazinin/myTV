name: Checks

# The site ships as written (ES modules on GitHub Pages), so a single
# too-new syntax feature blanks the app on 2019-2021 Samsung / LG TVs.
# Keep js/ at ES2017. js/app.bundle.js (for opening index.html as a file)
# is generated by `npm run build` and must match the sources.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: ES2017 syntax
        run: npx --yes es-check@9 es2017 "./js/**/*.js" --module
      - name: No post-Chromium-63 APIs
        run: |
          if grep -rnE '\?\.|\?\?|import\.meta|catch \{|globalThis|\.replaceChildren\(|toggleAttribute|\(\?<[=!A-Za-z]' js/; then
            echo "Found syntax or APIs newer than the TV baseline (see CLAUDE.md)"
            exit 1
          fi
      - name: File bundle is up to date
        run: |
          npm run build
          if ! git diff --quiet -- js/app.bundle.js; then
            echo "js/app.bundle.js is out of date: run 'npm run build' and commit it"
            exit 1
          fi
